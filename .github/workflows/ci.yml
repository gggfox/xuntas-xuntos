name: CI

on:
  push:
    branches: [main, production]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same version as the Dockerfile, so CI and production cannot
      # diverge on the one thing that cannot be tested from here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # With fake values: a real project is not needed to know whether it
      # compiles, and this way the production build cannot break unannounced.
      - name: Build
        run: npm run build
        env:
          VITE_CONVEX_URL: https://ci-placeholder.convex.cloud
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA

      # The two halves that `server.mjs` joins. If `vite build` stops
      # generating either one, the container would start and fail on the
      # first request.
      - name: Build leaves the two halves server.mjs needs
        run: |
          test -f dist/server/server.js
          test -d dist/client
