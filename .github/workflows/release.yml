# Promoción manual de `staging` a `production`. Este es el botón de release.
#
# Se dispara a mano a propósito: con `autoDeploy` encendido en Dokploy, todo
# lo que entra a `production` sale a usuarios reales. Durante la convocatoria
# esa decisión la toma una persona, no un merge.
#
# OJO — por qué el despliegue de Convex se hace aquí dentro y no se deja al
# trigger de convex-production.yml: los push hechos con GITHUB_TOKEN no
# disparan workflows de Actions (GitHub lo impide para evitar bucles). El
# webhook de la GitHub App de Dokploy sí llega, así que el contenedor sí se
# construye solo. convex-production.yml se queda como red de seguridad para
# cuando alguien empuja a `production` a mano desde su máquina.

name: release — promover staging a production

on:
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release:
    name: Promover a producción
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Mismo orden que en staging: backend antes que frontend.
      - name: Desplegar a Convex producción
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}

      # El push a `production` es lo que hace que Dokploy construya y cambie
      # el contenedor de producción.
      - name: Adelantar production a staging
        run: git push origin HEAD:production
