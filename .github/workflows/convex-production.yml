# Despliega el backend de Convex (funciones, esquema, crons) al deployment de
# producción cuando algo entra a la rama `production`.
#
# Por qué vive aquí y no en el Dockerfile: la imagen solo lleva el frontend.
# Convex es un backend aparte, con su propio ciclo de despliegue — meterlo en
# el build del contenedor lo ejecutaría en cada rebuild, incluso cuando no
# cambió una sola función.
#
# OJO con el orden. Este workflow y el webhook de Dokploy arrancan con el
# mismo push. En la práctica Convex termina primero (segundos contra los
# minutos que tarda `npm ci` + build de Docker), que es justo el orden que
# queremos: el esquema nuevo tiene que estar arriba antes de que el frontend
# nuevo empiece a consultarlo. No está garantizado por nada más que la
# diferencia de duración; si algún día importa de verdad, hay que encadenar
# los dos pasos explícitamente.

name: Convex — producción

on:
  push:
    branches: [production]
  # Permite relanzar a mano desde la pestaña Actions si un despliegue falla
  # sin que haya un commit nuevo que empujar.
  workflow_dispatch:

# Dos merges seguidos no deben desplegar en paralelo: el segundo esperaría y
# el orden de llegada dejaría de ser el orden de los commits.
concurrency:
  group: convex-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Mismo major que el runtime de la imagen (node:22-alpine).
          node-version: 22
          cache: npm

      # `npm ci` y no `npm install`: el lockfile manda, igual que en el
      # Dockerfile.
      - run: npm ci

      # `convex deploy` hace typecheck de convex/ antes de subir nada, así que
      # un error de tipos falla aquí y no a medias en producción.
      - name: Desplegar a Convex producción
        run: npx convex deploy
        env:
          # El nombre de la izquierda lo fija el CLI de Convex — es la variable
          # que lee. El de la derecha es cómo se llama el secreto en el repo.
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}
