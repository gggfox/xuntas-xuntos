# Promoción de `main` a `staging`.
#
# Flujo de ramas:  main  →  staging  →  production
#
# Este workflow NO vuelve a correr los checks: espera a que el workflow "CI"
# (ci.yml) termine en verde sobre `main` y solo entonces adelanta la rama.
# Duplicar typecheck/pruebas aquí sería más lento y, peor, podría discrepar
# de ci.yml sin que nadie se diera cuenta.
#
# `workflow_run` se dispara al terminar CI, en éxito o en fallo — por eso el
# `if` del job comprueba la conclusión. Sin esa comprobación se promocionaría
# también cuando las pruebas fallan.

name: main — promoción a staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: promote-staging
  cancel-in-progress: false

jobs:
  promote:
    name: Desplegar staging y adelantar la rama
    # En workflow_dispatch no hay `workflow_run`, así que se promociona a mano
    # bajo responsabilidad de quien pulsa el botón.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Se expone como env para poder preguntar por él en un `if`: el contexto
    # `secrets` no está disponible en las condiciones de un step, el de `env`
    # sí.
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # El commit exacto que CI verificó. Con workflow_run el checkout por
          # defecto apunta a la rama por defecto, no al commit del evento, y
          # se promocionaría algo distinto de lo que pasó los checks.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Convex primero y la rama después: el esquema nuevo tiene que estar
      # arriba antes de que Dokploy levante el frontend que lo consulta.
      #
      # TEMPORAL — todavía no existe el deployment de Convex de staging ni su
      # deploy key. Mientras falte el secreto este paso se salta en lugar de
      # tumbar el workflow. No es `continue-on-error`: eso dejaría el job en
      # amarillo permanente y con el tiempo nadie lo miraría.
      #
      # Para cerrarlo: crear el deployment de staging en Convex, generar la
      # key (`npx convex deployment token create ci-token`) y guardarla como
      # CONVEX_STAGING_DEPLOY_KEY. El paso se activa solo, sin tocar el YAML.
      - name: Desplegar a Convex staging
        if: env.CONVEX_DEPLOY_KEY != ''
        run: npm run deploy:convex

      - name: Aviso — Convex staging sin configurar
        if: env.CONVEX_DEPLOY_KEY == ''
        run: |
          echo "::warning title=Convex staging sin desplegar::Falta el secreto CONVEX_STAGING_DEPLOY_KEY, así que se saltó el despliegue del backend. El contenedor de staging sí se va a construir, pero apuntando a los placeholders REEMPLAZAR_* — va a responder errores hasta que se carguen los valores reales."

      # Fast-forward, sin --force. Si `staging` divergió de `main` esto falla,
      # y falla bien: significa que alguien commiteó directo a staging y hay
      # que mirarlo, no aplastarlo.
      - name: Adelantar staging a main
        run: git push origin HEAD:staging
