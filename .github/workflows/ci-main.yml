# Promotion of `main` to `staging`.
#
# Branch flow:  main  →  staging  →  production
#
# This workflow does NOT re-run the checks: it waits for the "CI" workflow
# (ci.yml) to finish green on `main` and only then fast-forwards the branch.
# Duplicating typecheck/tests here would be slower and, worse, could drift
# from ci.yml without anyone noticing.
#
# `workflow_run` fires when CI finishes, on success or on failure — that is
# why the job's `if` checks the conclusion. Without that check it would also
# promote when the tests fail.

name: main — promote to staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: promote-staging
  cancel-in-progress: false

jobs:
  promote:
    name: Deploy staging and fast-forward the branch
    # On workflow_dispatch there is no `workflow_run`, so promotion happens by
    # hand under the responsibility of whoever presses the button.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Exposed as env so an `if` can ask about it: the `secrets` context is not
    # available in step conditions, the `env` context is.
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit that CI verified. With workflow_run the default
          # checkout points at the default branch, not at the event's commit,
          # and something other than what passed the checks would be promoted.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Convex first and the branch after: the new schema has to be live
      # before Dokploy brings up the frontend that queries it.
      #
      # TEMPORARY — the Convex staging deployment does not exist yet, nor does
      # its deploy key. While the secret is missing this step is skipped
      # instead of taking the workflow down. It is not `continue-on-error`:
      # that would leave the job permanently yellow and over time nobody
      # would look at it.
      #
      # To close it out: create the staging deployment in Convex, generate the
      # key (`npx convex deployment token create ci-token`) and store it as
      # CONVEX_STAGING_DEPLOY_KEY. The step turns itself on, without touching
      # the YAML.
      - name: Deploy to Convex staging
        if: env.CONVEX_DEPLOY_KEY != ''
        run: npm run deploy:convex

      - name: Warning — Convex staging not configured
        if: env.CONVEX_DEPLOY_KEY == ''
        run: |
          echo "::warning title=Convex staging not deployed::The CONVEX_STAGING_DEPLOY_KEY secret is missing, so the backend deploy was skipped. The staging container will still be built, but pointing at the REEMPLAZAR_* placeholders — it will answer errors until the real values are loaded."

      # Fast-forward, without --force. If `staging` diverged from `main` this
      # fails, and fails for the right reason: it means someone committed
      # straight to staging and it needs looking at, not flattening.
      - name: Fast-forward staging to main
        run: git push origin HEAD:staging
